  <rect x="30" y="882" width="740" height="92" rx="12" fill="#ffffff" stroke="#c8745a" stroke-width="2.5"/>
  <rect x="42" y="896" width="6" height="64" rx="3" fill="#c8745a"/>
  <text x="62" y="916" font-size="17" font-weight="bold" fill="#2f4858">Mẹo chọn nhanh theo phom dáng Sợi Trẻ:</text>
  <text x="62" y="942" font-size="15" fill="#2b2b2b">• Áo khoác dù Mưa Bụi có phom rộng (oversize): muốn mặc gọn có thể chọn lùi 1 size.</text>
  <text x="62" y="964" font-size="15" fill="#2b2b2b">• Chưa chắc chắn về số đo? Gửi chiều cao &amp; vòng đo tại trang Liên hệ để nhóm tư vấn.</text>
