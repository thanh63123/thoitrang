    <text x="146" y="128" font-size="15" fill="#2b2b2b" text-anchor="middle">165 – 170</text>
    <text x="278" y="128" font-size="15" fill="#2b2b2b" text-anchor="middle">56 – 63</text>
    <text x="410" y="128" font-size="15" fill="#2b2b2b" text-anchor="middle">90 – 94</text>
    <text x="542" y="128" font-size="15" fill="#2b2b2b" text-anchor="middle">74 – 78</text>
    <text x="674" y="128" font-size="15" fill="#2b2b2b" text-anchor="middle">92 – 96</text>

    <rect x="0" y="140" width="740" height="34" fill="#ffffff" stroke="#c5d1d8" stroke-width="1"/>
    <text x="40" y="162" font-size="15" font-weight="bold" fill="#2f4858" text-anchor="middle">L</text>
    <text x="146" y="162" font-size="15" fill="#2b2b2b" text-anchor="middle">170 – 175</text>
    <text x="278" y="162" font-size="15" fill="#2b2b2b" text-anchor="middle">63 – 70</text>
    <text x="410" y="162" font-size="15" fill="#2b2b2b" text-anchor="middle">94 – 98</text>
    <text x="542" y="162" font-size="15" fill="#2b2b2b" text-anchor="middle">78 – 82</text>
    <text x="674" y="162" font-size="15" fill="#2b2b2b" text-anchor="middle">96 – 100</text>

    <rect x="0" y="174" width="740" height="34" fill="#f4f8fa" stroke="#c5d1d8" stroke-width="1"/>
    <text x="40" y="196" font-size="15" font-weight="bold" fill="#2f4858" text-anchor="middle">XL</text>
    <text x="146" y="196" font-size="15" fill="#2b2b2b" text-anchor="middle">175 – 180</text>
    <text x="278" y="196" font-size="15" fill="#2b2b2b" text-anchor="middle">70 – 78</text>
    <text x="410" y="196" font-size="15" fill="#2b2b2b" text-anchor="middle">98 – 103</text>
    <text x="542" y="196" font-size="15" fill="#2b2b2b" text-anchor="middle">82 – 87</text>
    <text x="674" y="196" font-size="15" fill="#2b2b2b" text-anchor="middle">100 – 105</text>

    <rect x="0" y="208" width="740" height="34" fill="#ffffff" stroke="#c5d1d8" stroke-width="1"/>
    <text x="40" y="230" font-size="15" font-weight="bold" fill="#2f4858" text-anchor="middle">XXL</text>
    <text x="146" y="230" font-size="15" fill="#2b2b2b" text-anchor="middle">178 – 185</text>
    <text x="278" y="230" font-size="15" fill="#2b2b2b" text-anchor="middle">78 – 86</text>
    <text x="410" y="230" font-size="15" fill="#2b2b2b" text-anchor="middle">103 – 108</text>
    <text x="542" y="230" font-size="15" fill="#2b2b2b" text-anchor="middle">87 – 93</text>
    <text x="674" y="230" font-size="15" fill="#2b2b2b" text-anchor="middle">105 – 110</text>

    <line x1="80" y1="38" x2="80" y2="242" stroke="#c5d1d8" stroke-width="1"/>
    <line x1="212" y1="38" x2="212" y2="242" stroke="#c5d1d8" stroke-width="1"/>
    <line x1="344" y1="38" x2="344" y2="242" stroke="#c5d1d8" stroke-width="1"/>
    <line x1="476" y1="38" x2="476" y2="242" stroke="#c5d1d8" stroke-width="1"/>
    <line x1="608" y1="38" x2="608" y2="242" stroke="#c5d1d8" stroke-width="1"/>
