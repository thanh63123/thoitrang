    <rect x="0" y="38" width="740" height="34" fill="#e3ecf0" stroke="#c5d1d8" stroke-width="1"/>
    <text x="40" y="60" font-size="14" font-weight="bold" fill="#1e323d" text-anchor="middle">Size</text>
    <text x="146" y="60" font-size="14" font-weight="bold" fill="#1e323d" text-anchor="middle">Chiều cao (cm)</text>
