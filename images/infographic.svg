    <text x="40" y="94" font-size="15" font-weight="bold" fill="#2f4858" text-anchor="middle">S</text>
    <text x="146" y="94" font-size="15" fill="#2b2b2b" text-anchor="middle">160 – 165</text>
    <text x="278" y="94" font-size="15" fill="#2b2b2b" text-anchor="middle">50 – 56</text>
    <text x="410" y="94" font-size="15" fill="#2b2b2b" text-anchor="middle">86 – 90</text>
    <text x="542" y="94" font-size="15" fill="#2b2b2b" text-anchor="middle">70 – 74</text>
    <text x="674" y="94" font-size="15" fill="#2b2b2b" text-anchor="middle">88 – 92</text>

    <rect x="0" y="106" width="740" height="34" fill="#f4f8fa" stroke="#c5d1d8" stroke-width="1"/>
