    <text x="40" y="162" font-size="15" font-weight="bold" fill="#c8745a" text-anchor="middle">L</text>
    <text x="146" y="162" font-size="15" fill="#2b2b2b" text-anchor="middle">160 – 165</text>
    <text x="278" y="162" font-size="15" fill="#2b2b2b" text-anchor="middle">52 – 58</text>
    <text x="410" y="162" font-size="15" fill="#2b2b2b" text-anchor="middle">86 – 90</text>
    <text x="542" y="162" font-size="15" fill="#2b2b2b" text-anchor="middle">68 – 72</text>
    <text x="674" y="162" font-size="15" fill="#2b2b2b" text-anchor="middle">92 – 96</text>

    <rect x="0" y="174" width="740" height="34" fill="#fdf9f4" stroke="#d6cbbd" stroke-width="1"/>
    <text x="40" y="196" font-size="15" font-weight="bold" fill="#c8745a" text-anchor="middle">XL</text>
    <text x="146" y="196" font-size="15" fill="#2b2b2b" text-anchor="middle">165 – 170</text>
    <text x="278" y="196" font-size="15" fill="#2b2b2b" text-anchor="middle">58 – 64</text>
    <text x="410" y="196" font-size="15" fill="#2b2b2b" text-anchor="middle">90 – 95</text>
    <text x="542" y="196" font-size="15" fill="#2b2b2b" text-anchor="middle">72 – 77</text>
    <text x="674" y="196" font-size="15" fill="#2b2b2b" text-anchor="middle">96 – 101</text>

    <rect x="0" y="208" width="740" height="34" fill="#ffffff" stroke="#d6cbbd" stroke-width="1"/>
    <text x="40" y="230" font-size="15" font-weight="bold" fill="#c8745a" text-anchor="middle">XXL</text>
    <text x="146" y="230" font-size="15" fill="#2b2b2b" text-anchor="middle">168 – 175</text>
    <text x="278" y="230" font-size="15" fill="#2b2b2b" text-anchor="middle">64 – 72</text>
    <text x="410" y="230" font-size="15" fill="#2b2b2b" text-anchor="middle">95 – 100</text>
    <text x="542" y="230" font-size="15" fill="#2b2b2b" text-anchor="middle">77 – 83</text>
    <text x="674" y="230" font-size="15" fill="#2b2b2b" text-anchor="middle">101 – 106</text>

    <line x1="80" y1="38" x2="80" y2="242" stroke="#d6cbbd" stroke-width="1"/>
    <line x1="212" y1="38" x2="212" y2="242" stroke="#d6cbbd" stroke-width="1"/>
    <line x1="344" y1="38" x2="344" y2="242" stroke="#d6cbbd" stroke-width="1"/>
    <line x1="476" y1="38" x2="476" y2="242" stroke="#d6cbbd" stroke-width="1"/>
    <line x1="608" y1="38" x2="608" y2="242" stroke="#d6cbbd" stroke-width="1"/>
